[project]
name = "wiked-source"
version = "0.1.0"
description = "Source development and integration tests for Wiked"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: optional validation of an explicitly selected external consumer"]
